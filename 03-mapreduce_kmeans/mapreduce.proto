syntax = "proto3";

package mapreduce;

service MapperService {
    rpc ProcessInput(MapperTask) returns (MapperResponse);
    rpc SendData(FetchRequest) returns (FetchResponse);
    rpc GetStatus(StatusRequest) returns (StatusResponse);
}

service ReducerService {
    rpc ProcessIntermediateData(ReducerTask) returns (ReducerResponse);
    rpc FetchData(FetchRequest) returns (FetchResponse);
}

message MapperTask {
    repeated float centroids = 1; // Flat list of centroids
    string input_data_path = 2;
    string task_id = 3;
    int32 num_reducers = 4;
    repeated int32 input_data_indices = 5; // Indices of data rows to process
}

message MapperResponse {
    bool success = 1;
    string message = 2;
    string intermediate_data_path = 3;
    string task_id = 4;
}

message ReducerTask {
    repeated string data_paths = 1; // Paths to data files that need to be processed
    string task_id = 2;
    int32 num_reducers = 3;
}

message ReducerResponse {
    bool success = 1;
    string message = 2;
    repeated float centroids = 3; // Added to include centroids directly in the response
    string task_id = 4;
}

message FetchRequest {
    repeated string keys = 1;
    string task_id = 2;
}

message FetchResponse {
    map<string, string> data = 1;  // Maps key to data points in string format
    string task_id = 2;
}

message StatusRequest {
    // Define any necessary request fields
}

message StatusResponse {
    bool is_running = 1;
    string message = 2;
}